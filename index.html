<!DOCTYPE html>
<html>
<head>
  <title>Easy Countdown Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>⏳ Easy Countdown Timer</h2>

    <input id="seconds" type="number" placeholder="Enter seconds">
    <br>
    <button id="start">Start</button>

    <div id="time">--</div>
  </div>

  <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

  <script src="timer.js"></script>

</body>
</html>
